<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Gen V1 — a conversation with room to work</title>
  <desc id="description">Gen V1 branding on a dark background with green accents and an abstract conversation expanding into connected work surfaces. Local AI workspace. Windows x64. Developer preview.</desc>
