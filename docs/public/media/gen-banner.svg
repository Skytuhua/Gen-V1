      <stop stop-color="#D0F6AE"/><stop offset="1" stop-color="#74B9A2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#D0F6AE" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="corners"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
