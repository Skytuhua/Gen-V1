name: M05 isolated Windows guard startup

on:
  push:
    branches: [diagnostic/m05-guard-startup-20261116]

permissions:
  contents: read

jobs:
  guard:
    name: Guard startup ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        lane: [production, protocol]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out isolated diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install pinned declared toolchain
        uses: ./.github/actions/setup

      - name: Verify production source and pinned Node archive
        run: |
          $ErrorActionPreference = 'Stop'
          $basis = 'de8700651e6eb97c5a60bf849802b51086244857'
          $changed = @(git diff --name-only $basis HEAD)
          $expected = @('.github/workflows/m05-guard-startup-diagnostic.yml', 'diagnostics/guard-startup/run.ts')
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin $expected }).Count -ne 0) { throw 'Diagnostic source differs outside its two declared files' }
          $archive = Join-Path $env:RUNNER_TEMP 'm05-node-v24.22.2-win-x64.zip'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.22.2/node-v24.22.2-win-x64.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ca1bff5d8ead13c9f2ea404a176db46bd430704d5b5113734049fa365e7799e2') { throw 'Pinned Node archive differs' }
          $extract = Join-Path $env:RUNNER_TEMP 'm05-node-v24.22.2'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $node = Join-Path $extract 'node-v24.22.2-win-x64/node.exe'
          $nodeDigest = (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeDigest -ne '1c331340fa6cac5e4294725959070a143fa0507195a78ad77eed7943f719aac9') { throw 'Pinned Node executable differs' }
          "M05_GUARD_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output ('M05_GUARD_NODE_IDENTITY=' + (@{version='24.22.2'; archiveSha256=$digest; nodeSha256=$nodeDigest} | ConvertTo-Json -Compress))

      - name: Observe unchanged guard startup
        run: |
          $ErrorActionPreference = 'Stop'
          $loader = (Join-Path $PWD 'node_modules/tsx/dist/loader.mjs')
          $loaderUrl = ([System.Uri]$loader).AbsoluteUri
          $arguments = @('--import', $loaderUrl, 'diagnostics/guard-startup/run.ts', '${{ matrix.lane }}')
          Write-Output ('M05_GUARD_PROBE_ARGV=' + (@{executable=$env:M05_GUARD_NODE; args=$arguments} | ConvertTo-Json -Compress))
          & $env:M05_GUARD_NODE @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve bounded diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guard-startup-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: guard-startup-results/receipt-${{ matrix.lane }}.json
