<!doctype html>
<html><head><meta charset="utf-8"><title>Sample plug-in</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#17181d;color:#e6e7ea;padding:20px}
  h1{font-size:16px;margin:0 0 8px}
  p{color:#9aa0aa;font-size:13px}
  .card{border:1px solid #2a2d36;border-radius:8px;padding:14px;margin-top:14px;background:#1d1f26}
</style>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var session = params.get('session');
  var pluginId = decodeURIComponent(location.pathname.split('/')[2] || '');
  var channel = new MessageChannel();
  channel.port1.onmessage = function (event) {
    var value = event.data;
    if (value && value.type === 'gen.plugin.connected' && value.session === session) {
      channel.port1.postMessage({type: 'gen.plugin.ready', pluginId: pluginId, session: session});
    }
    if (value && value.type === 'gen.plugin.flush' && value.session === session) {
      channel.port1.postMessage({type: 'gen.plugin.flushed', session: session, id: value.id, ok: true});
    }
  };
  channel.port1.start();
  parent.postMessage({type: 'gen.plugin.connect', pluginId: pluginId, session: session}, '*', [channel.port2]);
})();
</script></head>
<body>
  <h1>Sample plug-in · Overview</h1>
  <p>overview-map entry view</p>
  <div class="card">Synthetic plug-in workspace surface (fixture frame).</div>
</body></html>
