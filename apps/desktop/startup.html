<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Opening Gen V1</title>
  <style>
    *,::before,::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    html{color-scheme:dark;background:#0f0f0f}
    body{display:flex;flex-direction:column;color:#eee;font:13px/1.4 'Segoe UI',sans-serif}
    /* The native owner supplies the real OS controls in this clear top row. */
    .startup-chrome{flex:0 0 42px;height:42px;-webkit-app-region:drag;app-region:drag}
    main{display:flex;flex:1;min-width:0;min-height:0;align-items:center;gap:12px;padding:8px 16px 16px}
    .startup-mark{display:grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid #444;border-radius:6px;color:#eee;font-size:16px;font-weight:600}
    .startup-message{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}
    h1{margin:0;font-size:16px;line-height:1.25;font-weight:600}
    p{display:flex;align-items:center;gap:6px;margin:0;color:#aaa;overflow-wrap:break-word}
    .startup-pending{flex:none;width:12px;height:12px;color:currentColor}
    @media(forced-colors:active){html{background:Canvas}body,.startup-mark,p{color:CanvasText}.startup-mark{border-color:CanvasText}}
  </style>
</head>
<body>
  <div class="startup-chrome" aria-hidden="true"></div>
  <main aria-labelledby="startup-title">
    <div class="startup-mark" aria-hidden="true">G</div>
    <div class="startup-message" role="status" aria-live="polite" aria-atomic="true">
      <h1 id="startup-title">Opening your workspace</h1>
      <p id="startup-description"><svg class="startup-pending" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l2 2"/></svg>Waiting for the workspace…</p>
    </div>
  </main>
</body>
</html>
