<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Opening Gen V1</title>
  <style>
    *,::before,::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    html{color-scheme:dark;background:#0f0f0f}
    body{display:flex;flex-direction:column;color:#eee;font:13px/1.4 'Segoe UI',sans-serif}
    /* The native owner supplies the real OS controls in this clear top row. */
    .startup-chrome{flex:0 0 42px;height:42px;-webkit-app-region:drag;app-region:drag}
    main{display:flex;flex:1;min-width:0;min-height:0;flex-direction:column;justify-content:center;padding:6px 20px 16px}
    .startup-message{display:flex;flex-direction:column;gap:6px;min-width:0}
    h1{margin:0;font-size:16px;line-height:1.25;font-weight:600}
    p{margin:0;color:#aaa;overflow-wrap:break-word}
    .progress{flex:none;height:3px;margin-top:14px;background:#292929;overflow:hidden;border-radius:3px}
    .progress::before{display:block;content:'';width:32%;height:100%;background:#aaa;animation:open 1.5s ease-in-out infinite alternate}
    @keyframes open{to{transform:translateX(215%)}}
    @media(max-height:165px){main{padding:2px 16px 10px}.startup-message{gap:4px}p{font-size:12px}.progress{margin-top:10px}}
    @media(prefers-reduced-motion:reduce){.progress::before{animation:none;transform:translateX(100%)}}
  </style>
</head>
<body>
  <div class="startup-chrome" aria-hidden="true"></div>
  <main aria-labelledby="startup-title">
    <div class="startup-message" role="status" aria-live="polite" aria-atomic="true">
      <h1 id="startup-title">Opening Gen V1</h1>
      <p id="startup-description">Your workspace is starting. Your saved conversations will appear shortly.</p>
    </div>
    <div class="progress" role="progressbar" aria-label="Opening workspace" aria-describedby="startup-description"></div>
  </main>
</body>
</html>
