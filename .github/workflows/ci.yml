name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: third-party/hermes-agent/runtime-requirements.txt

      - name: Select the isolated worker interpreter
        run: |
          $workerPython = (Get-Command python).Source
          "HARNESS_HERMES_PYTHON=$workerPython" >> $env:GITHUB_ENV

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Hermes dependencies
        run: python -m pip install --disable-pip-version-check --no-warn-script-location --target .harness-hermes-python-deps -r third-party/hermes-agent/runtime-requirements.txt

      - name: Install test browser
        run: pnpm exec playwright install chromium

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run application regression tests
        run: pnpm test --maxWorkers=1

      - name: Verify original source custody
        run: python -I -S -B tests/hermes_source_contract.py -v

      - name: Verify atomic learning controls
        run: python -I -S -B tests/hermes_atomic_controls.py -v

      - name: Verify original Hermes worker behavior
        run: python -I -S -B tests/hermes_source_worker.py -v

      - name: Build web application
        run: pnpm build

      - name: Build desktop shell
        run: pnpm desktop:build
