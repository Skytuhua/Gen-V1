name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: third-party/hermes-agent/runtime-requirements.txt

      - name: Select the isolated worker interpreter
        run: |
          $workerPython = (Get-Command python).Source
          "HARNESS_HERMES_PYTHON=$workerPython" >> $env:GITHUB_ENV

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify the public plug-in API package
        run: |
          pnpm build:plugin-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/plugin-api-package.test.mjs

      - name: Install optional visuals plug-in dependencies
        run: pnpm --dir plugins/personal-visuals install --ignore-workspace --frozen-lockfile

      - name: Exercise UI guard negative and positive fixtures
        run: pnpm test:ui-guard

      - name: Install isolated Hermes dependencies
        run: python -m pip install --disable-pip-version-check --no-warn-script-location --target .harness-hermes-python-deps -r third-party/hermes-agent/runtime-requirements.txt

      - name: Install pinned integration wheels for regression tests
        run: |
          $lock = Get-Content -Raw -LiteralPath third-party/integrations/PYTHON_LOCK.json | ConvertFrom-Json
          $requirements = foreach ($distribution in $lock.distributions) {
            if ($distribution.name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or
                $distribution.sourceUrl -notmatch '^https://files\.pythonhosted\.org/[^?#\s]+\.whl$' -or
                $distribution.wheelSha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'Invalid pinned integration wheel identity'
            }
            "$($distribution.name) @ $($distribution.sourceUrl) --hash=sha256:$($distribution.wheelSha256)"
          }
          $requirementsPath = Join-Path $env:RUNNER_TEMP 'gen-integration-wheel-requirements.txt'
          $requirements | Set-Content -LiteralPath $requirementsPath -Encoding utf8
          python -m pip install --disable-pip-version-check --no-warn-script-location --only-binary=:all: --no-deps --require-hashes --no-compile --target .harness-integrations-python-deps --requirement $requirementsPath

      - name: Install test browser
        run: pnpm exec playwright install chromium

      - name: Check TypeScript and enforce UI architecture policy
        run: pnpm lint

      - name: Check and build the optional visuals plug-in
        run: |
          pnpm --dir plugins/personal-visuals typecheck
          pnpm --dir plugins/personal-visuals build

      - name: Build web application
        run: pnpm build

      - name: Run application regression tests
        run: pnpm test

      - name: Exercise split workspace in the browser
        env:
          GEN_SPLIT_RENDERER_BROWSER: '1'
          GEN_SPLIT_APP_BROWSER: '1'
        run: pnpm exec vitest run tests/split-workspace-renderer.test.ts tests/split-app-browser.test.ts --maxWorkers=1

      - name: Verify original source custody
        run: python -I -S -B tests/hermes_source_contract.py -v

      - name: Verify atomic learning controls
        run: python -I -S -B tests/hermes_atomic_controls.py -v

      - name: Verify original Hermes worker behavior
        run: python -I -S -B tests/hermes_source_worker.py -v

      - name: Build desktop shell
        run: pnpm desktop:build
