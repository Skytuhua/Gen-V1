name: Agents UI evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Agents grid UI evidence (Windows, pinned Edge)
    if: github.event.pull_request.number == 311
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify Microsoft Edge is available before anything else
        run: |
          $candidates = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) {
            $cmd = Get-Command msedge -ErrorAction SilentlyContinue
            if ($cmd) { $edge = $cmd.Source }
          }
          if (-not $edge) {
            Write-Error 'FAIL-CLOSED: Microsoft Edge is not installed or discoverable on this runner. Stopping instead of installing or substituting a browser.'
            exit 1
          }
          Write-Output "Edge found at $edge"
          & $edge --version

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: ./.github/actions/setup

      - name: Run agents-workspace browser suite (candidate transform)
        env:
          AGENTSUI_EVIDENCE_DIR: test-results/browser/agents-workspace
        run: pnpm test:browser -- --suite agents-workspace

      - name: Run pinned-Edge spec against the actual App (candidate transform disabled)
        env:
          AGENTSUI_APP_CANDIDATE: '0'
          AGENTSUI_EVIDENCE_DIR: test-results/browser/agents-workspace-actual-app
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser/agents-workspace-actual-app/results.json
        run: pnpm exec playwright test --config tests/e2e/agents-workspace.playwright.config.ts tests/e2e/agents-workspace.spec.ts --reporter=list,json

      - name: Capture populated evidence at the corrected head
        env:
          AGENTSUI_EVIDENCE_LABEL: after
          AGENTSUI_EVIDENCE_DIR: test-results/evidence
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec playwright test --config tests/e2e/agents-workspace.playwright.config.ts tests/e2e/agents-workspace-evidence.spec.ts --reporter=list

      - name: Check out the pre-correction base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: base
          ref: d31d055e40f99742d918e546c6a07367eca39cb4

      - name: Install base dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile

      - name: Copy the evidence spec into the base checkout
        run: Copy-Item tests/e2e/agents-workspace-evidence.spec.ts base/tests/e2e/agents-workspace-evidence.spec.ts

      - name: Capture populated evidence at the pre-correction base
        working-directory: base
        env:
          AGENTSUI_EVIDENCE_LABEL: before
          AGENTSUI_EVIDENCE_DIR: test-results/evidence
        run: pnpm exec playwright test --config tests/e2e/agents-workspace.playwright.config.ts tests/e2e/agents-workspace-evidence.spec.ts --reporter=list

      - name: Retain evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agents-ui-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/evidence/
            test-results/browser/
            base/test-results/evidence/
          retention-days: 14
          if-no-files-found: warn
