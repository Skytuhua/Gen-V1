name: Stale claim release

on:
  schedule:
    # Sweep open issues every 15 minutes for claims older than the stale threshold.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List issues that would be released without writing"
        type: boolean
        required: true
        default: true

permissions:
  issues: write

jobs:
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: stale-claim-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Release stale claims on open issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Manual runs default to a dry run; scheduled runs always release.
            const dryRun = github.event_name === 'workflow_dispatch'
              ? (context.payload.inputs?.dry_run === 'true' || context.payload.inputs?.dry_run === true)
              : false;
            const STALE_MINUTES = 60;
            const RELEASE_LABELS = /in.?progress|claimed|wip|assigned|active/i;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            core.info(`Scanning ${issues.length} open issues (dryRun=${dryRun}).`);

            const stale = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              let latest = null;
              for (const c of comments) {
                const marker = c.body.slice(0, 300).match(/\b(CLAIM|CHECKPOINT|RELEASE)\b/);
                if (!marker) continue;
                if (!latest || new Date(c.created_at) > new Date(latest.comment.created_at)) {
                  latest = { comment: c, kind: marker[1] };
                }
              }
              if (!latest) continue;
              const released =
                latest.kind === 'RELEASE' || /OWNER\s*=\s*NONE/i.test(latest.comment.body);
              if (released) continue;
              const ageMinutes = Math.floor(
                (Date.now() - new Date(latest.comment.created_at).getTime()) / 60000,
              );
              if (ageMinutes <= STALE_MINUTES) continue;
              stale.push({ issue, latest, ageMinutes });
            }

            core.info(`Found ${stale.length} stale claim(s).`);
            for (const { issue, latest, ageMinutes } of stale) {
              core.info(
                `#${issue.number} ${issue.title} — latest ${latest.kind} ${ageMinutes}m old: ${latest.comment.html_url}`,
              );
              if (dryRun) continue;

              const utc = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: [
                  `[stale-claim-sweeper] RELEASE | UTC=${utc} | STATUS=RELEASED`,
                  `ISSUE=${issue.html_url}; OWNER=NONE; RECIPIENT=NONE`,
                  `DELTA=auto-released stale claim: latest ${latest.kind} was ${ageMinutes} minutes old with no RELEASE (threshold ${STALE_MINUTES} min)`,
                  `HISTORY=${latest.comment.html_url}`,
                  `NEXT=unclaimed; any worker may claim per AGENTS.md`,
                ].join('\n'),
              });
              if (issue.assignees.length > 0) {
                await github.rest.issues.removeAssignees({
                  ...context.repo,
                  issue_number: issue.number,
                  assignees: issue.assignees.map((a) => a.login),
                });
              }
              for (const label of issue.labels) {
                const name = typeof label === 'string' ? label : label.name;
                if (!RELEASE_LABELS.test(name)) continue;
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: issue.number,
                    name,
                  });
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
              }
            }
