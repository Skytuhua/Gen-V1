name: M05 native Save diagnostic
on:
  push:
    branches: [agent/m05-native-save-diagnostic-43760736519]
permissions:
  contents: read
jobs:
  native-save:
    name: Native Save diagnostic (${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [direct, policy]
    steps:
      - name: Check out the isolated diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: ./.github/actions/setup
      - name: Run the actual native Save lane
        shell: pwsh
        run: pnpm exec tsx diagnostics/native-save/run.ts ${{ matrix.lane }}
      - name: Preserve bounded native window observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-save-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .harness-native-save-diagnostic/${{ matrix.lane }}/receipt.json
