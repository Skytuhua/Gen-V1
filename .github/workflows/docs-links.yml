name: Docs links

# Markdown links rot when a host, path or heading moves. Pull requests check paths and
# anchors offline, because that result is deterministic; push, schedule and manual runs
# also request external URLs and fail only on a missing host, 404 or 410.
on:
  pull_request:
    paths: ['**/*.md', scripts/check-doc-links.mjs, .github/workflows/docs-links.yml]
  push:
    branches: [main]
    paths: ['**/*.md', scripts/check-doc-links.mjs, .github/workflows/docs-links.yml]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true

jobs:
  links:
    name: Markdown links
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2

      - name: Check Markdown links
        run: node scripts/check-doc-links.mjs ${{ github.event_name != 'pull_request' && '--external' || '' }}
