name: Harness toolchain
description: Install pnpm, Node, locked workspace dependencies and optional Python test dependencies.

inputs:
  python:
    description: Also install Python 3.14 plus the pinned Hermes and integration wheel dependencies.
    required: false
    default: 'false'
  playwright:
    description: Also cache and install the pinned Playwright Chromium browser.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.30.3

    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.22.2
        cache: pnpm

    - name: Install locked dependencies
      shell: pwsh
      run: pnpm install --frozen-lockfile

    - name: Install Python
      if: inputs.python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
        architecture: x64
        cache: pip
        cache-dependency-path: third-party/hermes-agent/runtime-requirements.txt

    - name: Cache pinned Python test dependencies
      if: inputs.python == 'true'
      id: python-deps
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          .harness-hermes-python-deps
          .harness-integrations-python-deps
        key: python-deps-${{ runner.os }}-${{ hashFiles('third-party/hermes-agent/runtime-requirements.txt', 'third-party/integrations/PYTHON_LOCK.json') }}

    - name: Install pinned Python test dependencies
      if: inputs.python == 'true' && steps.python-deps.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check --no-warn-script-location --target .harness-hermes-python-deps -r third-party/hermes-agent/runtime-requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $lock = Get-Content -Raw -LiteralPath third-party/integrations/PYTHON_LOCK.json | ConvertFrom-Json
        $requirements = foreach ($distribution in $lock.distributions) {
          if ($distribution.name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or
              $distribution.sourceUrl -notmatch '^https://files\.pythonhosted\.org/[^?#\s]+\.whl$' -or
              $distribution.wheelSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Invalid pinned integration wheel identity'
          }
          "$($distribution.name) @ $($distribution.sourceUrl) --hash=sha256:$($distribution.wheelSha256)"
        }
        $requirementsPath = Join-Path $env:RUNNER_TEMP 'gen-integration-wheel-requirements.txt'
        $requirements | Set-Content -LiteralPath $requirementsPath -Encoding utf8
        python -m pip install --disable-pip-version-check --no-warn-script-location --only-binary=:all: --no-deps --require-hashes --no-compile --target .harness-integrations-python-deps --requirement $requirementsPath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Read the pinned browser version
      if: inputs.playwright == 'true'
      id: playwright-version
      shell: pwsh
      run: |
        $version = node -p "require('@playwright/test/package.json').version"
        "version=$version" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

    - name: Cache the test browser
      if: inputs.playwright == 'true'
      id: playwright-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~\AppData\Local\ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install test browser
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: pnpm exec playwright install chromium

    - name: Select the isolated worker interpreter
      if: inputs.python == 'true'
      shell: pwsh
      run: |
        $workerPython = (Get-Command python).Source
        "HARNESS_HERMES_PYTHON=$workerPython" >> $env:GITHUB_ENV
