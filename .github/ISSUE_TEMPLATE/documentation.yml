name: Documentation feedback
description: Report a confusing step, broken link or missing explanation.
title: "[Docs] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thanks for helping make the docs clearer. You do not need a proposed fix. Use sample data and leave out credentials, account identifiers and private paths."
  - type: input
    id: page
    attributes:
      label: Page or section
      description: "Link the page or name the file and section."
      placeholder: "For example: docs/getting-started.md, Start the application"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or missing?
      description: "Describe what you were trying to do and where you got stuck. For setup feedback, include the version and relevant environment details."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: "Optional. Share clearer wording, a missing example or the information you expected to find."
