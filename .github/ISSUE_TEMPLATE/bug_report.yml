name: Bug report
description: Report a reproducible problem with Gen V1.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Search existing issues first and use synthetic or redacted data. Do not upload credentials, application profiles or private conversations. For sensitive findings, follow [SECURITY.md](https://github.com/Skytuhua/Gen-V1/blob/main/SECURITY.md)."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "For example: v0.6.4, or the commit used for a source build"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Windows version, desktop or browser (include browser version), and Node/Python versions for source builds. Do not include private paths or account identifiers."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "List the smallest steps that reproduce the problem, using sample data. Say whether it happens every time or intermittently."
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Describe what happened. Screenshots or short redacted logs are helpful; caption any sample data or scripted behavior and remove credentials, account identifiers and private paths."
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround or additional context
      description: "Optional. Include anything you tried or a related issue. You do not need to know the cause."
